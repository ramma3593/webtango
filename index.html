<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TangoWeb</title>
    <style>html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;text-align:center;align-content:center}</style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script>
    (function() {
        var origFocus = HTMLElement.prototype.focus;
        var lastFocusedBacking = null;
        var inPointerUp = false;
        var focusedDuringGesture = false;

        window.addEventListener('pointerdown', function() {
            focusedDuringGesture = false;
        }, true);
        window.addEventListener('pointerup', function() {
            inPointerUp = true;
            setTimeout(function() { inPointerUp = false; }, 0);
        }, true);

        HTMLElement.prototype.focus = function(options) {
            if (this.classList && this.classList.contains('compose-backing-field')) {
                lastFocusedBacking = this;
                if (this.getAttribute('inputmode') === 'number') {
                    this.setAttribute('inputmode', 'numeric');
                }
                this.style.webkitUserSelect = 'text';
                this.style.userSelect = 'text';
                this.style.minWidth = '16px';
                this.style.minHeight = '16px';
                if (inPointerUp) {
                    focusedDuringGesture = true;
                }
            }
            return origFocus.call(this, options);
        };

        window.addEventListener('touchend', function(e) {
            var el = lastFocusedBacking;
            if (!el || !el.isConnected) return;
            var root = el.getRootNode && el.getRootNode();
            var isActive = root && root.activeElement === el;
            var shouldRefocus = focusedDuringGesture;
            if (!shouldRefocus && isActive && e.changedTouches && e.changedTouches.length > 0) {
                var t = e.changedTouches[0];
                var r = el.getBoundingClientRect();
                if (r.width > 0 && r.height > 0 &&
                    t.clientX >= r.left - 24 && t.clientX <= r.right + 24 &&
                    t.clientY >= r.top - 24 && t.clientY <= r.bottom + 24) {
                    shouldRefocus = true;
                }
            }
            if (shouldRefocus) {
                focusedDuringGesture = false;
                if (el.getAttribute('inputmode') === 'number') {
                    el.setAttribute('inputmode', 'numeric');
                }
                e.preventDefault = function() {};
                var s = el.selectionStart, end = el.selectionEnd;
                el.blur();
                origFocus.call(el, { preventScroll: true });
                try {
                    if (s != null && end != null) el.setSelectionRange(s, end);
                } catch (_) {}
            }
        }, true);
    })();
    </script>
    <script type="application/javascript" src="webApp.js"></script>
</body>
</html>
