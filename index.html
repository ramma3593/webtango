<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TangoWeb</title>
    <style>html,body{width:100%;height:100%;margin:0;padding:0;overflow:hidden;text-align:center;align-content:center}</style>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" defer></script>
</head>
<body>
    <svg xmlns="http://www.w3.org/2000/svg" width="40" height="40" viewBox="0 0 50 50" role="presentation">
        <circle cx="25" cy="25" r="20" stroke="#ccc" stroke-width="4" fill="none"/>
        <circle cx="25" cy="25" r="20" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"
                stroke-dasharray="90 125">
            <animateTransform attributeName="transform" type="rotate" from="0 25 25" to="360 25 25" dur="1s"
                              repeatCount="indefinite"/>
        </circle>
    </svg>
    <script>
    (function() {
        var origFocus = HTMLElement.prototype.focus;
        var isTouchDevice = ('ontouchstart' in window) || (navigator.maxTouchPoints > 0);
        var touchActive = false;
        var inUserActivationEvent = false;
        var pendingFocusEl = null;
        var currentBackingEl = null;
        var keyboardWasVisible = false;

        if (window.visualViewport) {
            window.visualViewport.addEventListener('resize', function() {
                var diff = window.innerHeight - window.visualViewport.height;
                if (diff > 80) {
                    keyboardWasVisible = true;
                } else if (diff < 40 && keyboardWasVisible) {
                    keyboardWasVisible = false;
                    if (currentBackingEl && currentBackingEl.isConnected) {
                        try { currentBackingEl.blur(); } catch (_) {}
                    }
                }
            });
        }

        window.addEventListener('touchstart', function() {
            touchActive = true;
            pendingFocusEl = null;
        }, true);

        window.addEventListener('pointerdown', function(e) {
            if (e.pointerType === 'touch' || e.pointerType === 'pen') {
                touchActive = true;
                pendingFocusEl = null;
            }
        }, true);

        HTMLElement.prototype.focus = function(options) {
            if (this.tagName === 'CANVAS') {
                if (currentBackingEl && currentBackingEl.isConnected) {
                    return;
                }
            }
            if (this.classList && this.classList.contains('compose-backing-field')) {
                currentBackingEl = this;
                if (this.getAttribute('inputmode') === 'number') {
                    this.setAttribute('inputmode', 'numeric');
                }
                this.style.webkitUserSelect = 'text';
                this.style.userSelect = 'text';
                this.style.minWidth = '24px';
                this.style.minHeight = '24px';

                var root = this.getRootNode && this.getRootNode();
                if (root && root.querySelector) {
                    var canvas = root.querySelector('canvas');
                    if (canvas && canvas.hasAttribute('tabindex')) {
                        canvas.removeAttribute('tabindex');
                    }
                }

                if (isTouchDevice && !inUserActivationEvent) {
                    if (touchActive) {
                        pendingFocusEl = this;
                    }
                    var isAlreadyActive = root && root.activeElement === this;
                    if (!isAlreadyActive) {
                        return;
                    }
                }
            }
            return origFocus.call(this, options);
        };

        function activatePendingFocus(e) {
            var el = pendingFocusEl;
            pendingFocusEl = null;
            touchActive = false;
            if (!el || !el.isConnected) return;
            if (el.getAttribute('inputmode') === 'number') {
                el.setAttribute('inputmode', 'numeric');
            }
            var root = el.getRootNode && el.getRootNode();
            var isAlreadyActive = root && root.activeElement === el;
            inUserActivationEvent = true;
            try {
                if (isAlreadyActive && !keyboardWasVisible) {
                    var s = el.selectionStart, end = el.selectionEnd;
                    el.blur();
                    origFocus.call(el);
                    try {
                        if (s != null && end != null) el.setSelectionRange(s, end);
                    } catch (_) {}
                } else if (!isAlreadyActive) {
                    origFocus.call(el);
                }
            } finally {
                inUserActivationEvent = false;
            }
            if (e && e.cancelable && e.type === 'touchend') {
                e.preventDefault();
            }
        }

        window.addEventListener('touchend', function(e) {
            if (pendingFocusEl) {
                activatePendingFocus(e);
            } else {
                touchActive = false;
            }
        }, false);

        window.addEventListener('touchcancel', function() {
            pendingFocusEl = null;
            touchActive = false;
        }, true);

        window.addEventListener('mouseup', function(e) {
            if (pendingFocusEl) {
                activatePendingFocus(e);
            }
        }, false);

        window.addEventListener('click', function(e) {
            if (pendingFocusEl) {
                activatePendingFocus(e);
            }
        }, false);
    })();
    </script>
    <script type="application/javascript" src="webApp.js?v=2"></script>
</body>
</html>
